# 兜底同步：读取一次最新 Release，校验 APK 后提交，并显式调用 Pages 部署工作流。
# GITHUB_TOKEN 产生的推送不会触发另一条 push 工作流，所以部署必须接在同步任务后。
name: Sync APK

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *' # 每天北京时间 09:17。

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Download and validate the latest APK and manifest
        env:
          LIVE_APK_URL: ${{ vars.LIVE_APK_URL || 'https://jicun.netlify.app/downloads/jicun.apk' }}
        run: |
          set -euo pipefail
          JSON=$(curl -fsSL --retry 3 --connect-timeout 30 --max-time 60 \
            https://api.github.com/repos/l0x0hhh/zongce/releases/latest)
          TAG=$(echo "$JSON" | jq -er '.tag_name | select(type == "string" and length > 0)')
          URL=$(echo "$JSON" | jq -er '[.assets[]? | select(.name | endswith(".apk"))][0].browser_download_url | select(type == "string" and length > 0)')
          mkdir -p public/downloads
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 180 \
            -o public/downloads/jicun.apk "$URL"
          unzip -t public/downloads/jicun.apk > /dev/null
          unzip -Z1 public/downloads/jicun.apk > "$RUNNER_TEMP/apk-files.txt"
          grep -qx AndroidManifest.xml "$RUNNER_TEMP/apk-files.txt"
          SHA=$(sha256sum public/downloads/jicun.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s public/downloads/jicun.apk)
          echo "$JSON" | jq --arg apkUrl "$LIVE_APK_URL" --arg sha256 "$SHA" --argjson size "$SIZE" \
            '{version: (.tag_name | ltrimstr("v")), title: (.name // "暨存更新"), notes: (.body // ""), apkUrl: $apkUrl, sha256: $sha256, size: $size}' \
            > public/downloads/latest.json
          echo "同步版本：$TAG（$SIZE 字节，SHA-256 $SHA）"
      - name: Commit if the APK or manifest changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- public/downloads/jicun.apk public/downloads/latest.json)" ]; then
            echo '已经是最新，无需提交。'
            exit 0
          fi
          git config user.name apk-sync
          git config user.email apk-sync@users.noreply.github.com
          git add public/downloads/jicun.apk public/downloads/latest.json
          git commit -m 'chore: sync the latest APK and update manifest'
          git push origin HEAD:main

  # 即使同步没有产生新提交，也可修复之前未成功发布的 Pages 部署。
  deploy:
    needs: sync
    uses: ./.github/workflows/deploy-pages.yml
